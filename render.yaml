services:
  # Servicio Web (Backend API + WebApp)
  - type: web
    name: cryptoswap-wallet-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET_KEY
        generateValue: true
      - key: DEFAULT_SPREAD_PERCENTAGE
        value: "1.0"
      - key: QUOTE_TTL_SECONDS
        value: "30"
      - key: DATABASE_URL
        fromDatabase:
          name: cryptoswap-db
          property: connectionString

# Base de Datos PostgreSQL Gestionada en la nube
databases:
  - name: cryptoswap-db
    plan: free
    databaseName: wallet_db
    user: wallet_user
